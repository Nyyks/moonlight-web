<svg xmlns="http://www.w3.org/2000/svg" width="828" height="300" viewBox="0 0 828 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">GPU time per frame of MWSR, FSR1, NIS, SGSR1 and bilinear</title>
<desc id="d">Median GPU time of one 1080p to 1440p frame of the game picture, on two GPUs. The values are in the table below the figure.</desc>
<text x="0" y="22" font-size="17" font-weight="600" fill="#f0efec">GPU time per frame</text>
<text x="0" y="44" font-size="13" fill="#c3c2b7">1080p → 1440p, game picture, median of 1,800 draws (lower is faster). Each panel has its own scale.</text>
<text x="0" y="84" font-size="13" font-weight="600" fill="#f0efec">GeForce RTX 5060 Ti</text>
<line x1="78.0" y1="96" x2="78.0" y2="250" stroke="#8f8e88" stroke-width="1"/>
<text x="0" y="115" font-size="13" fill="#c3c2b7" dominant-baseline="middle">Bilinear</text>
<path d="M78.0 106.0 h4.1 a4 4 0 0 1 4 4 v10.0 a4 4 0 0 1 -4 4 h-4.1 z" fill="#55544f"/>
<text x="92.1" y="115.0" font-size="12" fill="#c3c2b7" dominant-baseline="middle">0.029 ms</text>
<text x="0" y="145" font-size="13" fill="#f0efec" dominant-baseline="middle" font-weight="600">MWSR</text>
<path d="M78.0 136.0 h28.3 a4 4 0 0 1 4 4 v10.0 a4 4 0 0 1 -4 4 h-28.3 z" fill="#3987e5"/>
<text x="116.3" y="145.0" font-size="12" fill="#c3c2b7" dominant-baseline="middle">0.116 ms</text>
<text x="0" y="175" font-size="13" fill="#c3c2b7" dominant-baseline="middle">SGSR1</text>
<path d="M78.0 166.0 h28.9 a4 4 0 0 1 4 4 v10.0 a4 4 0 0 1 -4 4 h-28.9 z" fill="#8a8984"/>
<text x="116.9" y="175.0" font-size="12" fill="#c3c2b7" dominant-baseline="middle">0.118 ms</text>
<text x="0" y="205" font-size="13" fill="#c3c2b7" dominant-baseline="middle">FSR1</text>
<path d="M78.0 196.0 h69.9 a4 4 0 0 1 4 4 v10.0 a4 4 0 0 1 -4 4 h-69.9 z" fill="#8a8984"/>
<text x="157.9" y="205.0" font-size="12" fill="#c3c2b7" dominant-baseline="middle">0.265 ms (f16)</text>
<text x="0" y="235" font-size="13" fill="#c3c2b7" dominant-baseline="middle">NIS *</text>
<path d="M78.0 226.0 h248.0 a4 4 0 0 1 4 4 v10.0 a4 4 0 0 1 -4 4 h-248.0 z" fill="#8a8984"/>
<text x="336.0" y="235.0" font-size="12" fill="#c3c2b7" dominant-baseline="middle">0.904 ms</text>
<text x="428" y="84" font-size="13" font-weight="600" fill="#f0efec">Radeon iGPU (Ryzen 9 9900X)</text>
<line x1="506.0" y1="96" x2="506.0" y2="250" stroke="#8f8e88" stroke-width="1"/>
<text x="428" y="115" font-size="13" fill="#c3c2b7" dominant-baseline="middle">Bilinear</text>
<path d="M506.0 106.0 h4.2 a4 4 0 0 1 4 4 v10.0 a4 4 0 0 1 -4 4 h-4.2 z" fill="#55544f"/>
<text x="520.2" y="115.0" font-size="12" fill="#c3c2b7" dominant-baseline="middle">0.449 ms</text>
<text x="428" y="145" font-size="13" fill="#f0efec" dominant-baseline="middle" font-weight="600">MWSR</text>
<path d="M506.0 136.0 h65.4 a4 4 0 0 1 4 4 v10.0 a4 4 0 0 1 -4 4 h-65.4 z" fill="#3987e5"/>
<text x="581.4" y="145.0" font-size="12" fill="#c3c2b7" dominant-baseline="middle">3.80 ms (f16)</text>
<text x="428" y="175" font-size="13" fill="#c3c2b7" dominant-baseline="middle">SGSR1</text>
<path d="M506.0 166.0 h50.3 a4 4 0 0 1 4 4 v10.0 a4 4 0 0 1 -4 4 h-50.3 z" fill="#8a8984"/>
<text x="566.3" y="175.0" font-size="12" fill="#c3c2b7" dominant-baseline="middle">2.97 ms (f16)</text>
<text x="428" y="205" font-size="13" fill="#c3c2b7" dominant-baseline="middle">FSR1</text>
<path d="M506.0 196.0 h111.8 a4 4 0 0 1 4 4 v10.0 a4 4 0 0 1 -4 4 h-111.8 z" fill="#8a8984"/>
<text x="627.8" y="205.0" font-size="12" fill="#c3c2b7" dominant-baseline="middle">6.33 ms (f16)</text>
<text x="428" y="235" font-size="13" fill="#c3c2b7" dominant-baseline="middle">NIS *</text>
<path d="M506.0 226.0 h248.0 a4 4 0 0 1 4 4 v10.0 a4 4 0 0 1 -4 4 h-248.0 z" fill="#8a8984"/>
<text x="764.0" y="235.0" font-size="12" fill="#c3c2b7" dominant-baseline="middle">13.78 ms</text>
<text x="0" y="276" font-size="12" fill="#8f8e88">WebGPU in Chrome, GPU timestamps around batches of 100 draws; the RTX at P0 throughout, the iGPU at its own clock (neither fixed).</text>
<text x="0" y="294" font-size="12" fill="#8f8e88">Each at its faster precision (f32 or f16). * MoonlightWeb's per-fragment port of NIS, not NVIDIA's compute shader.</text>
</svg>