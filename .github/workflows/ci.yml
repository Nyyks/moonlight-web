# MoonlightWeb — unified CI pipeline.
#
# Single gated pipeline, each stage blocks the next:
#   1. quality + frontend tests — frontend job (Prettier+ESLint then Vitest, one
#      npm install) plus C++ quality (clang-format + cppcheck).
#   2. backend tests — Qt Test + OpenCppCoverage (70% gate), after C++ quality.
#   3. installers — the full release packaging (release.yml, reused as a
#      workflow) for Windows x64/ARM64, Linux x64 and macOS arm64, once the
#      frontend job and backend tests are green. There is no separate
#      compile-only build stage, because packaging compiles the same four
#      targets and then exercises what a bare build never touches (staging,
#      windeployqt, the Inno Setup script, linuxdeploy, macdeployqt + signing).
#   4. container image — docker.yml, also reused as a workflow, on a v* tag
#      only. The `edge` tag comes off docker.yml's own push trigger; this call
#      is what publishes a release image to GHCR behind the same gates.
#
# Packaging never runs on a broken commit, so the (expensive) multi-platform
# matrix is only spent on validated code.
name: CI

on:
  pull_request:
  push:
    # Tags ONLY — a v* tag is the one push that must be validated and packaged
    # automatically, because this pipeline is what publishes the release assets
    # (release.yml no longer carries its own tag trigger, so packaging can never
    # run twice and race itself for the upload).
    #
    # Deliberately NOT branches: a branch push does not spend the multi-platform
    # matrix by default. Want installers for an untagged commit? Run this
    # workflow from the Actions tab (workflow_dispatch) on that branch — same
    # pipeline, same artifacts, just on demand.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "dev = MoonlightWebDev, x.y.z-sha-dev · staging = hidden PROD build, x.y.z-sha-stg (artifacts only, nothing published)"
        type: choice
        default: dev
        options:
          - dev
          - staging

# Least-privilege token: this pipeline only reads the repo and writes artifacts.
permissions:
  contents: read

# Cancel superseded runs on a PR or a manual branch run to save CI minutes, but
# never cancel a tag run: that one publishes the release assets and must go to
# completion.
concurrency:
  # The channel is part of the key: a staging run must not cancel a dev run on
  # the same branch.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.channel }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ──────────────────── 1. QUALITY + FRONTEND TESTS ────────────────────
  # Frontend quality and tests share one job: they're sequential anyway (tests
  # gate on quality) and a single npm install/Node setup serves both.
  frontend:
    name: Frontend (Prettier + ESLint + Vitest, 70% gate)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      # A release publishes README.next.md as README.md: a tag that skipped the
      # promotion would ship a README one release behind.
      - name: README promoted for the release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        run: bash scripts/promote-readme.sh --check
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prettier + ESLint + i18n
        id: quality
        run: npm run check
      - name: Report quality
        if: failure()
        run: |
          {
            echo "### ❌ Frontend quality failed"
            echo ""
            echo "Run locally and commit the fixes:"
            echo '```bash'
            echo "cd frontend"
            echo "npm run format:fix   # auto-format with Prettier"
            echo "npm run lint:fix     # auto-fix ESLint issues"
            echo "npm run i18n         # check the translation catalogs"
            echo '```'
            echo "Remaining ESLint errors must be fixed by hand — see the log above."
            echo "i18n failures are fixed by adding the key to every locale in frontend/locales/."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run tests with coverage
        run: npm run coverage
      - name: Report tests
        # Only when quality passed but tests/coverage failed, so the report points
        # at the right failure.
        if: failure() && steps.quality.outcome == 'success'
        run: |
          {
            echo "### ❌ Frontend tests / coverage gate failed"
            echo ""
            echo "Reproduce locally: \`cd frontend && npm run coverage\`."
            echo "Either a test regressed or coverage dropped below the 70% gate."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  # ──────────────────── 1a. THE OFFICIAL INTERFACES ────────────────────
  # The entry page holds every machine's interface against the list of the
  # release it says it runs (bootstrap/v1/official.js, D26), so a list that does
  # not match its tag would turn away every machine of that release. Each list
  # is rebuilt here from its tag, and one whose release is not tagged yet from
  # the commit itself, which is the one that will be tagged. On a v* tag the
  # release's own list must be in the tagged commit, and — while production
  # refuses rather than reports (PRODUCTION_ENFORCES) — production must serve it
  # before a package is built: a machine that installs the release before the
  # server knows it would be refused.
  interface-lists:
    name: Official interface lists
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # each list is rebuilt from its release tag
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Each list against its tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/interface-list.mjs check --release "${GITHUB_REF_NAME#v}"
          else
            node scripts/interface-list.mjs check
          fi
      - name: Production serves the release's list
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/interface-list.mjs live "${GITHUB_REF_NAME#v}" https://stream.moonlightweb.top

  # ──────────────────── 1b. THE UPSCALER LABORATORY (software GPUs) ────────────────────
  # The two renderers run MoonlightWeb's own upscaler on SwiftShader — WebGPU's
  # fallback adapter, then ANGLE on SwiftShader for WebGL2 — through the lab's
  # conformity flow (docs/design/upscaler-mwsr.md §3.6, criterion C11): every
  # shader text compiles, the WebGPU chain gives the kernel's picture exactly,
  # the WebGL2 twin the same quality. Not blocking yet: the software adapters of
  # a hosted runner are new ground (plan §12.1, P4).
  scaler-lab:
    name: Upscaler lab (SwiftShader conformity, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Exact versions: a release of any of them must not change what the lab
      # measures, or run code nobody looked at, from one run to the next.
      - run: pip install "websocket-client==1.8.0" "numpy==2.1.3" "pillow==11.0.0" "scikit-image==0.24.0"
      - name: WebGPU side (the kernel cells and the WebGPU chain)
        env:
          MW_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: python scripts/bench/scaler-lab/scaler_lab.py --tag ci --swiftshader --page-timeout 240 --conformity
      - name: WebGL2 side (the GLSL twin) and the comparison
        # The twin's conformity is judged even when the WebGPU side failed:
        # on a runner whose software adapter refuses to import a video frame
        # (CI 39661997273) the WebGPU chain is not applicable, the kernel
        # cells and the WebGL2 twin still are.
        if: always()
        env:
          MW_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: python scripts/bench/scaler-lab/scaler_lab.py --tag ci --webgl-swiftshader --page-timeout 240 --conformity --md
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: scaler-lab-conformity
          path: |
            bench-out/scaler-lab/*.md
            bench-out/scaler-lab/conf-*.json
          if-no-files-found: ignore

  quality-cpp-format:
    name: Quality · C++ clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Pin to the same major.minor as the bundled LLVM (VS2022) to avoid
      # formatting disagreements across clang-format versions.
      - run: pip install "clang-format==19.1.7"
      # The suite is held to the same style as what it tests: a test file is
      # read far more often than it is written, and letting it drift is how
      # `backend/tests/` ended up 12 files out of line while `src/` stayed
      # clean. Vendored code (backend/libs, backend/third_party) is never in
      # scope.
      #
      # git pathspecs rather than a grep on the listing: git's fnmatch has no
      # FNM_PATHNAME here, so `*` spans directories and matches the extension
      # exactly. The old `grep -E '\.(cpp|h)$'` was right on GNU grep but also
      # matched `build.sh` on Git Bash, which quietly fed shell scripts to
      # clang-format on a maintainer's machine.
      - name: Check formatting (house style in backend/.clang-format)
        run: |
          git ls-files -- 'backend/src/*.cpp' 'backend/src/*.h' \
                          'backend/tests/*.cpp' 'backend/tests/*.h' \
            | xargs clang-format --dry-run --Werror
      - name: Report
        if: failure()
        run: |
          {
            echo "### ❌ C++ formatting failed"
            echo ""
            echo "Apply the house style (backend/.clang-format) and commit:"
            echo '```bash'
            echo "git ls-files -- 'backend/src/*.cpp' 'backend/src/*.h' 'backend/tests/*.cpp' 'backend/tests/*.h' | xargs clang-format -i"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  quality-cppcheck:
    name: Quality · C++ cppcheck
    # Pinned image and package: ubuntu-latest moving to 26.04 brought cppcheck
    # 2.19 in with no change of ours, and its new checks failed the stage.
    # Raise both together, on purpose, with the warnings fixed in that commit.
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y cppcheck=2.19.0-3
      - run: cppcheck --version
      - name: Run cppcheck
        working-directory: backend
        run: |
          cppcheck --enable=warning --library=qt --std=c++17 --language=c++ \
            --inline-suppr \
            --suppress=missingInclude --suppress=missingIncludeSystem \
            --suppress=unknownMacro \
            --error-exitcode=1 -I src src
      - name: Report
        if: failure()
        run: |
          {
            echo "### ❌ cppcheck found static-analysis issues"
            echo ""
            echo "See the annotated warnings above (null derefs, leaks, uninit vars…)."
            echo "Fix them, or add an inline \`// cppcheck-suppress <id>\` with justification."
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────── 2. BACKEND TESTS ──────────────────────────
  test-backend:
    name: Tests · Backend (Qt Test + OpenCppCoverage, 70% gate)
    needs: [quality-cpp-format, quality-cppcheck]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive # moonlight-common-c provides Limelight.h
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: 6.11.2
          arch: win64_msvc2022_64
          # The control-channel test (b1591f08) links Qt WebSockets.
          modules: qtwebsockets
          # aqt 3.3.0 doesn't know the new Qt 6.11 per-arch repo layout (404s on
          # Updates.xml); pin the commit that added it. py7zr 1.1.0 avoids the 7z
          # path-sanitization bug (aqtinstall#995) that breaks SBOM extraction.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b
          py7zrversion: ==1.1.0
          extra: --base https://download.qt.io # official server (fallback mirrors serve incomplete XML)
      - name: Set up MSVC environment
        uses: ./.github/actions/msvc-env
        with:
          arch: x64
      - name: Install OpenCppCoverage
        run: choco install opencppcoverage -y
      - name: Add OpenCppCoverage to PATH
        shell: pwsh
        run: echo "C:\Program Files\OpenCppCoverage" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Run backend TNR + coverage
        shell: cmd
        run: backend\tests\run_coverage.bat
      - name: Report
        if: failure()
        shell: bash
        run: |
          {
            echo "### ❌ Backend tests / coverage gate failed"
            echo ""
            echo "Reproduce on Windows: \`backend\\tests\\run_coverage.bat\`."
            echo "Either a Qt Test regressed or line coverage dropped below the 70% gate."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-coverage
          path: backend/tests/build/covhtml
          if-no-files-found: ignore

  # ─────────────────────────── 3. INSTALLERS ───────────────────────────
  # Reuses release.yml verbatim, so what lands in this run's artifacts is the
  # exact installer a v* tag would publish — Inno Setup .exe (Windows x64 +
  # ARM64), .deb/.rpm/.AppImage (Linux) and the guided .pkg (macOS), each
  # wrapped in a zip by upload-artifact. Untagged runs follow the `channel`
  # input: dev builds MoonlightWebDev (installs beside a production MoonlightWeb,
  # never over it) stamped <last tag>.g<3-char sha>-dev, staging builds the PROD
  # edition stamped <last tag>.g<3-char sha>-stg. Both publish nothing: the
  # gh-release steps in release.yml are gated on refs/tags — and on a v* tag run
  # they see the tag ref, so this is also the path that publishes the release.
  #
  # Skipped on pull_request: a fork's PR token is read-only, so requesting the
  # contents:write below would fail the job outright. Fork PRs still get the
  # quality and test stages above.
  package:
    name: Installers
    needs: [frontend, test-backend, interface-lists]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/release.yml
    with:
      channel: ${{ inputs.channel || 'dev' }}
    # A called workflow can never exceed the caller's token, and the check is
    # made when the run starts: a permission release.yml asks for and this job
    # does not grant fails the whole run with "startup_failure", before a
    # single step executes. Every scope any job in release.yml requests has to
    # be listed here (this pipeline's default is contents:read):
    #   contents  → publishing the release assets
    #   pages     → configure-pages / upload-pages-artifact (linux-repo)
    #   id-token  → the OIDC token deploy-pages exchanges (linux-repo-deploy)
    permissions:
      contents: write
      pages: write
      id-token: write
    # MW_* (DNS/ACME) live in the MoonlightWeb environment the packaging jobs
    # request; without inherit they'd resolve empty → LAN-only installers.
    secrets: inherit

  # ──────────────────────── 4. CONTAINER IMAGE ────────────────────────
  # The release image for a v* tag, gated on the same green quality/tests as
  # the installers. Tags only: `edge` (the tip of main) is published by
  # docker.yml's own push trigger, and a manual CI run on a branch is about
  # installers — an image from it would have no tag to answer to.
  #
  # Independent of `package`: a Debian container has nothing to do with the
  # Windows/macOS/Linux desktop bundles, and making it wait would only delay
  # the pull for no gain.
  docker:
    name: Container image
    needs: [frontend, test-backend, interface-lists]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/docker.yml
    # Every scope docker.yml requests has to be granted here, or the run fails
    # at startup before a step executes (see the note on `package` above):
    # `packages` pushes to ghcr.io, `contents` is the checkout.
    permissions:
      contents: read
      packages: write
    # Same reason as `package`: the MW_* DNS/ACME secrets live in the
    # MoonlightWeb environment, and without inherit they resolve empty → an
    # image that cannot turn Internet Access on.
    secrets: inherit
